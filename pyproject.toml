[project]
name = "opensnake"
version = "0.1.0"
description = "Desktop snake game that plays on a transparent overlay while opencode is processing"
readme = "README.md"
authors = [
    { name = "Hugo Batista <code at hugobatista.com>" }
]
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6,<3.0",
    "typer>=0.12,<1.0",
]

[project.scripts]
opensnake = "opensnake.cli:main"

[tool.uv]
required-version = "0.11.18"
exclude-newer = "30 days"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensnake"]

[dependency-groups]
lint = [
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]
dev = [
    "hatch>=1.16.5",
    {include-group = "lint"},
    {include-group = "test"},
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.hatch.envs.default.scripts]
lint = "ruff check . --fix"
format = "ruff format ."
lint-check = "ruff check ."
format-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy"
validate = ["lint", "format", "test", "typecheck"]
check = ["lint-check", "format-check", "test", "typecheck"]

[tool.pytest.ini_options]
addopts = "--tb=short --strict-markers --cov --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/opensnake"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 27
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
incremental = false
check_untyped_defs = true
files = ["src"]
exclude = ["tests/"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
